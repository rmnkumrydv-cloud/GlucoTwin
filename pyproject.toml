[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucotwin"
version = "0.2.0"
description = "Digital twin that forecasts post-meal glucose spikes 2 hours ahead (Happiest Health Digital Twin Challenge 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []          # installed from requirements.txt (see README, step 3)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
